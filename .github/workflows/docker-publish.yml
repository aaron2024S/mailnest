name: docker-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（如 0.1.0），会同时打 <version> 和 latest 两个 tag'
        required: true
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不装 QEMU：只构建 amd64（runner 原生架构），arm64 在 QEMU 下 npm ci
      # 会随机 SIGILL（exit 132），2026-11-09 用户决定不再发 arm64 镜像
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mailnest:${{ inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mailnest:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
