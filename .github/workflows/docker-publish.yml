name: docker-publish

on:
  workflow_dispatch:
    inputs:
      version:
        # 留空即跟随 package.json —— 版本号只有那一个出处。
        # 以前这里是 required: true，每次发版都要手抄一遍；抄错不会报错，
        # 只会静默打出一个错 tag，等发现时镜像已经推出去了。
        description: '镜像版本号（留空 = 用 package.json 里的版本号）'
        required: false
        default: ''
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 解析发版版本号：入参留空就用 package.json 里的值。
      # 无论走哪条路都先过格式校验 —— 挡住 latest / 带 v 前缀 / 空串这类手滑。
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG_VER="$(node -p "require('./package.json').version")"
          INPUT="$(printf '%s' "${INPUT_VERSION:-}" | tr -d '[:space:]')"
          INPUT="${INPUT#v}"
          VER="${INPUT:-$PKG_VER}"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号 '$VER' 不是 x.y.z 形式（不要填 latest）"
            exit 1
          fi
          if [ "$VER" != "$PKG_VER" ]; then
            echo "::warning::入参 $VER 与 package.json 的 $PKG_VER 不一致，镜像会打成 $VER"
          fi
          echo "package.json : $PKG_VER"
          echo "本次发版     : $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # 不装 QEMU：只构建 amd64（runner 原生架构），arm64 在 QEMU 下 npm ci
      # 会随机 SIGILL（exit 132），2026-11-09 用户决定不再发 arm64 镜像
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mailnest:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mailnest:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
