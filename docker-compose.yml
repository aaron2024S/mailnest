version: "3.8"

services:
  mailnest:
    # 跟着 latest 走：版本号只在 package.json 一处，发版 workflow 同时推
    # <版本> 与 latest 两个 tag。要钉死某一版就把 latest 换成具体号。
    image: aaron2024s/mailnest:latest
    container_name: mailnest
    restart: unless-stopped
    ports:
      # 默认 8006:8006；想换端口时在 .env 里写 PORT=9000，或启动前 export PORT=9000
      - "${PORT:-8006}:${PORT:-8006}"
    environment:
      # 容器内监听端口，跟随上面的 PORT 一起变
      PORT: "${PORT:-8006}"
      # 走 HTTPS（反向代理）后改成 true，浏览器才会带 Secure cookie
      MAILNEST_SECURE_COOKIES: "false"
      # 自然语言时间范围（今天/上个月/去年10月）按哪个时区解释。
      # 用标准 TZ，镜像里默认就是 Asia/Shanghai，这里写出来是方便直接改。
      # 刻意不用 ${TZ:-...} 继承宿主机：部分 NAS 把 TZ 设成 ":/etc/localtime"
      # 这类 POSIX 写法，不是合法时区名，继承过来会让容器启动直接失败。
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/app/data
